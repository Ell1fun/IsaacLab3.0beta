spec_version: "0.1"
task:
  family: manager_based/manipulation/pick_place
  variant: g1_inspire_hand_tracking_demo
  generated_file_stem: auto_pickplace_unitree_g1_steering_wheel_teleop_env_cfg
  gym_id: Isaac-Auto-PickPlace-UnitreeG1-SteeringWheel-Teleop-v0
  notes: Unitree G1 Inspire Hand pick_place 示例 spec，用于验证 schema 表达能力。
robot:
  preset: unitree_g1_inspire_ftp
  robot_cfg_import: isaaclab_assets.robots.unitree:G1_INSPIRE_FTP_CFG
  base_link_name: pelvis
  eef_link_names:
    left: left_wrist_yaw_link
    right: right_wrist_yaw_link
  controlled_joint_names:
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_pitch_joint
    - left_elbow_roll_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_pitch_joint
    - right_elbow_roll_joint
  hand_joint_names:
    - left_index_0_joint
    - left_middle_0_joint
    - left_ring_0_joint
    - left_pinky_0_joint
    - left_thumb_0_joint
    - right_index_0_joint
    - right_middle_0_joint
    - right_ring_0_joint
    - right_pinky_0_joint
    - right_thumb_0_joint
  fixed_base: false
  idle_wrist_pose:
    left:
      pos: [0.25, 0.22, 0.95]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    right:
      pos: [0.25, -0.22, 0.95]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
scene:
  ground:
    kind: ground_plane
  table:
    usd_path: "${ISAAC_NUCLEUS_DIR}/Props/Mounts/SeattleLabTable/table_instanceable.usd"
    pose:
      pos: [0.6, 0.0, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
object:
  preset: steering_wheel
  usd_path: "TODO: object usd path"
  pose:
    pos: [0.6, 0.0, 0.8]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  single_rigid_body: true
target:
  pose:
    pos: [0.6, -0.25, 0.8]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
control:
  mode: pink_ik
  gravity_compensation: true
  teleop:
    enabled: true
    input_source: openxr_hand_tracking
    world_T_anchor:
      pos: [0.0, 0.0, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    rebase: false
    hand:
      mode: dexpilot
      dexpilot_config_path: source/isaaclab_tasks/isaaclab_tasks/manager_based/manipulation/pick_place/config/unitree_hand_left_dexpilot.yml
mdp:
  terminations:
    timeout_s: 30.0
    object_dropped: true
    success: true
  rewards:
    enabled: false
