spec_version: "0.1"
task:
  family: manager_based/manipulation/pick_place
  variant: r11_steering_wheel_hand_tracking_teleop
  generated_file_stem: auto_pickplace_r11_steering_wheel_hand_tracking_teleop_env_cfg
  gym_id: Isaac-Auto-PickPlace-R11-SteeringWheel-HandTracking-Teleop-v0
  notes: R11 hand tracking example generated from current presets.
robot:
  preset: seres_r11_a2_high_pd
  robot_cfg_import: isaaclab_assets.robots.seres_r11:R11_A2_HIGH_PD_CFG
  urdf_path: assets/seres_r11/r11_0615.urdf
  base_link_name: pelvis
  eef_link_names:
    left: left_wrist_yaw_Link
    right: right_wrist_yaw_Link
  fixed_base: true
  idle_wrist_pose:
    left:
      pos: [0.32, 0.22, 1.05]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
    right:
      pos: [0.32, -0.22, 1.05]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
scene:
  ground:
    kind: ground_plane
  table:
    usd_path: ${ISAAC_NUCLEUS_DIR}/Props/PackingTable/packing_table.usd
    pose:
      pos: [0.0, 0.55, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
object:
  preset: steering_wheel
  usd_path: ${ISAACLAB_NUCLEUS_DIR}/Mimic/pick_place_task/pick_place_assets/steering_wheel.usd
  pose:
    pos: [0.0, 0.45, 0.9996]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  scale: [0.75, 0.75, 0.75]
  single_rigid_body: true
target:
  pose:
    pos: [0.25, 0.45, 0.9996]
    quat_xyzw: [0.0, 0.0, 0.0, 1.0]
control:
  mode: pink_ik
  teleop:
    enabled: true
    input_source: openxr_hand_tracking
    world_T_anchor:
      pos: [0.0, 0.0, 0.0]
      quat_xyzw: [0.0, 0.0, 0.0, 1.0]
mdp:
  terminations:
    timeout_s: 30.0
    object_dropped: true
    success: true
  rewards:
    enabled: false
